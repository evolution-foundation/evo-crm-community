name: "Build & Publish Gateway Image"

on:
  push:
    branches: [main, develop]
    paths:
      - "nginx/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: registry.bellosoft.dev
  IMAGE_NAME: registry.bellosoft.dev/evolution-foundation/evo-crm-gateway

jobs:
  build:
    name: Build amd64
    runs-on: [self-hosted, X64, Linux, bellosoft]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to ZOD Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,scope=linux/amd64,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-amd64
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: Merge Manifests & Tag
    needs: build
    runs-on: [self-hosted, X64, Linux, bellosoft]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to ZOD Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Generate version tags
        id: version
        if: github.event_name == 'workflow_dispatch'
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          BUILD_VERSION="${BUILD_DATE}-${{ github.run_number }}"
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${BUILD_VERSION}"

      - name: Resolve tags
        id: tags
        env:
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          DISPATCH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="${{ env.IMAGE_NAME }}"
          SHA_SHORT="${GH_SHA:0:7}"
          TAGS=""

          if [[ -n "${DISPATCH_VERSION}" ]]; then
            TAGS="${IMAGE}:${DISPATCH_VERSION},${IMAGE}:latest"
          elif [[ "${GH_REF}" == refs/heads/main ]]; then
            TAGS="${IMAGE}:latest,${IMAGE}:main-${SHA_SHORT}"
          elif [[ "${GH_REF}" == refs/heads/develop ]]; then
            TAGS="${IMAGE}:develop,${IMAGE}:develop-${SHA_SHORT}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        working-directory: /tmp/digests
        env:
          MERGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${MERGE_TAGS}"
          TAG_ARGS=""
          for tag in "${TAG_ARRAY[@]}"; do
            TAG_ARGS="${TAG_ARGS} -t ${tag}"
          done

          docker buildx imagetools create ${TAG_ARGS} \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
