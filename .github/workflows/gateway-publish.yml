name: "Build & Publish Gateway Image"

on:
  push:
    branches: [main, develop]
    paths:
      - "nginx/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: registry.bellosoft.dev
  IMAGE_NAME: registry.bellosoft.dev/evolution-foundation/evo-crm-gateway

jobs:
  build:
    name: Build & Push amd64
    runs-on: [self-hosted, X64, Linux, bellosoft]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to ZOD Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Generate version tags
        id: version
        if: github.event_name == 'workflow_dispatch'
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          BUILD_VERSION="${BUILD_DATE}-${{ github.run_number }}"
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${BUILD_VERSION}"

      - name: Resolve tags
        id: tags
        env:
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          DISPATCH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE="${{ env.IMAGE_NAME }}"
          SHA_SHORT="${GH_SHA:0:7}"
          TAGS=""

          if [[ -n "${DISPATCH_VERSION}" ]]; then
            TAGS="${IMAGE}:${DISPATCH_VERSION},${IMAGE}:latest"
          elif [[ "${GH_REF}" == refs/heads/main ]]; then
            TAGS="${IMAGE}:latest,${IMAGE}:main-${SHA_SHORT}"
          elif [[ "${GH_REF}" == refs/heads/develop ]]; then
            TAGS="${IMAGE}:develop,${IMAGE}:develop-${SHA_SHORT}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,scope=linux/amd64,mode=max

      - name: Image digest
        run: |
          echo "Gateway image: ${{ steps.tags.outputs.tags }} @ ${{ steps.build.outputs.digest }}"
