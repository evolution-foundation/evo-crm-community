name: Release

on:
  workflow_dispatch:

env:
  REGISTRY: registry.bellosoft.dev
  IMAGE_PREFIX: registry.bellosoft.dev/evolution-foundation

jobs:
  version:
    name: Generate Version
    runs-on: [self-hosted, X64, Linux, bellosoft]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate version tags
        id: version
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          BUILD_VERSION="${BUILD_DATE}-${{ github.run_number }}"
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${BUILD_VERSION}"

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    needs: version
    runs-on: [self-hosted, X64, Linux, bellosoft]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - service: evo-auth-service-community
            context: ./evo-auth-service-community
            dockerfile: ./evo-auth-service-community/Dockerfile
          - service: evo-ai-crm-community
            context: ./evo-ai-crm-community
            dockerfile: ./evo-ai-crm-community/docker/Dockerfile
          - service: evo-ai-frontend-community
            context: ./evo-ai-frontend-community
            dockerfile: ./evo-ai-frontend-community/Dockerfile
          - service: evo-ai-processor-community
            context: ./evo-ai-processor-community
            dockerfile: ./evo-ai-processor-community/Dockerfile
          - service: evo-ai-core-service-community
            context: ./evo-ai-core-service-community
            dockerfile: ./evo-ai-core-service-community/Dockerfile
          - service: evo-flow-community
            context: ./evo-flow-community
            dockerfile: ./evo-flow-community/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ZOD Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "${{ matrix.service }} digest: ${{ steps.build.outputs.digest }}"

  create-release:
    name: Create GitHub Release
    needs: [version, build-and-push]
    runs-on: [self-hosted, X64, Linux, bellosoft]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Docker Images

            All images are available on the Bellosoft registry under the `evolution-foundation` org. The Docker tag matches this release's version, `${{ needs.version.outputs.version }}`:

            ```bash
            docker pull ${{ env.IMAGE_PREFIX }}/evo-auth-service-community:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/evo-ai-crm-community:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/evo-ai-frontend-community:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/evo-ai-processor-community:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/evo-ai-core-service-community:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/evo-flow-community:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/evo-bot-runtime:${{ needs.version.outputs.version }}
            docker pull ${{ env.IMAGE_PREFIX }}/evo-crm-gateway:${{ needs.version.outputs.version }}
            ```

            Or, equivalently, `:latest` always tracks the most recent build.
