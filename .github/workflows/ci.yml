name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test scripts/generate-secrets.sh
        run: bash .github/scripts/test-generate-secrets.sh

      - name: Unfilled .env.example must not start
        run: |
          cp .env.example .env
          if docker compose config --quiet 2> compose.err; then
            echo "::error::docker compose accepted .env.example without generated secrets"
            exit 1
          fi
          grep -q "must be set in .env" compose.err

      - name: Seed .env from example
        run: |
          cp .env.example .env
          bash scripts/generate-secrets.sh .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Every generated secret is required by compose
        run: bash .github/scripts/test-compose-guards.sh

      - name: CRM submodule sends the auth its own token
        # CRM-829: generate-secrets.sh gives EVOAI_AUTH_API_TOKEN its own value. A CRM
        # that still sends EVOAI_CRM_API_TOKEN gets a 401 and every RBAC check denies.
        run: |
          if ! grep -q "ENV\['EVOAI_AUTH_API_TOKEN'\]" evo-ai-crm-community/app/services/evo_auth_service.rb; then
            echo "::error::evo-ai-crm-community does not send EVOAI_AUTH_API_TOKEN to the auth; bump it to a commit with evo-ai-crm-community#450"
            exit 1
          fi

  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Lint Auth Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-auth-service-community/Dockerfile
          failure-threshold: error

      - name: Lint CRM Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-crm-community/docker/Dockerfile
          failure-threshold: error

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-frontend-community/Dockerfile
          failure-threshold: error

      - name: Lint Processor Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-processor-community/Dockerfile
          failure-threshold: error

      - name: Lint Core Service Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: evo-ai-core-service-community/Dockerfile
          failure-threshold: error

  check-migration-collision:
    name: Check Migration Version Collision (CRM vs auth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run migration collision guard
        run: ./scripts/check_migration_collision.sh
